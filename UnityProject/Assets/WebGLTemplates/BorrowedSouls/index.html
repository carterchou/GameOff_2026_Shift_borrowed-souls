<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07080b; }
      body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #07080b; touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
                 color: #cfe9f2; font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; pointer-events: none; }
      #loading .title { font-size: clamp(28px, 7vmin, 64px); letter-spacing: 0.25em; text-shadow: 0 0 18px #3fb6d9; }
      #loading .sub { font-size: clamp(12px, 2.6vmin, 18px); letter-spacing: 0.2em; opacity: 0.7; }
      #bar { width: min(60vw, 420px); height: 6px; background: #1b2229; border-radius: 3px; overflow: hidden; }
      #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3fb6d9, #a8f0ff); transition: width 0.2s; }
      #message { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 90vw; color: #fff; font-family: sans-serif; font-size: 14px; }
      #message div { padding: 8px 12px; margin-bottom: 6px; border-radius: 4px; background: #8a6d00; }
      #message div.error { background: #a01818; }
      /* A phone held upright: the game is landscape only. */
      #rotate { display: none; position: absolute; inset: 0; z-index: 10; background: #07080bf2; color: #cfe9f2; flex-direction: column;
                align-items: center; justify-content: center; gap: 16px; text-align: center; font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
      #rotate .icon { width: 56px; height: 92px; border: 4px solid #a8f0ff; border-radius: 10px; animation: turn 2s ease-in-out infinite; }
      #rotate p { margin: 0; font-size: 18px; letter-spacing: 0.1em; }
      #rotate small { opacity: 0.6; letter-spacing: 0.05em; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="title">借魂</div>
        <div class="sub">BORROWED SOULS</div>
        <div id="bar"><div id="bar-fill"></div></div>
      </div>
      <div id="message"></div>
      <div id="rotate"><div class="icon"></div><p>請將手機橫放</p><small>Rotate your phone to landscape</small></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

      function showBanner(msg, type) {
        var box = document.querySelector("#message");
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.className = "error";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 5000);
      }

      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      // Keep the page itself from scrolling or zooming under the thumbs.
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // The talents and the chosen body live in a save file; keep it between visits.
        autoSyncPersistentDataPath: true,
        // Sharp enough, and a high-density screen would otherwise render several times the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 1.25 : 1.5),
      };

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
